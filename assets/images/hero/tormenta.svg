<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="t">
  <title id="t">Fondo atmosférico de referencia: tormenta eléctrica sobre instalación industrial</title>
  <desc id="d">Ilustración vectorial de referencia. No es una fotografía de una instalación de UZABAL.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123c2f"/>
      <stop offset="0.5" stop-color="#174636"/>
      <stop offset="1" stop-color="#061a14"/>
    </linearGradient>
    <radialGradient id="flash" cx="72%" cy="30%" r="48%">
      <stop offset="0" stop-color="#cdeede" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#8bbfa8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8bbfa8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leftFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#072219" stop-opacity="0.98"/>
      <stop offset="0.38" stop-color="#072219" stop-opacity="0.82"/>
      <stop offset="0.72" stop-color="#072219" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#072219" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="bolt" fill="none" stroke="#eafff5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0 70 150 34 138 118 330 78 205 116 214 36 62 74 70z" stroke-width="5"/>
      <path d="M78 205 34 138" stroke-width="3"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Banco de nubes (formas suaves superpuestas) -->
  <g filter="url(#soft)" opacity="0.5" fill="#a9c9b8">
    <ellipse cx="1180" cy="160" rx="360" ry="110"/>
    <ellipse cx="1420" cy="230" rx="300" ry="120"/>
    <ellipse cx="900" cy="220" rx="250" ry="90"/>
    <ellipse cx="1300" cy="330" rx="420" ry="100"/>
    <ellipse cx="730" cy="120" rx="240" ry="80"/>
  </g>
  <g filter="url(#soft)" opacity="0.32" fill="#e3efe8">
    <ellipse cx="1250" cy="120" rx="260" ry="70"/>
    <ellipse cx="1500" cy="170" rx="220" ry="80"/>
    <ellipse cx="1010" cy="260" rx="190" ry="70"/>
  </g>
  <g filter="url(#soft2)" opacity="0.22" fill="#0a2c21">
    <ellipse cx="1130" cy="390" rx="400" ry="85"/>
    <ellipse cx="1500" cy="420" rx="280" ry="90"/>
  </g>

  <rect width="1600" height="900" fill="url(#flash)"/>

  <!-- Rayos -->
  <g filter="url(#glow)">
    <use href="#bolt" transform="translate(1090 90) rotate(8) scale(1.05)" opacity="0.95"/>
    <use href="#bolt" transform="translate(1370 150) rotate(-10) scale(0.62)" opacity="0.65"/>
    <use href="#bolt" transform="translate(890 180) rotate(16) scale(0.45)" opacity="0.45"/>
  </g>

  <!-- Silueta industrial -->
  <g fill="#051912" opacity="0.92">
    <path d="M0 800h110v-80h100v80h120v-130h140v130h100v-100h150v100h120v-175h120v175h100v-95h160v95h130v-140h130v140h120v100H0z"/>
    <rect x="985" y="530" width="14" height="270"/>
    <path d="M992 530 1016 610 968 610z"/>
    <rect x="1080" y="660" width="9" height="140"/>
    <rect x="1250" y="620" width="11" height="180"/>
    <path d="M1255 620 1272 668 1238 668z"/>
    <path d="M700 690 700 590l18-34 18 34v100z"/>
  </g>
  <g fill="#e0c37e" opacity="0.55">
    <rect x="220" y="750" width="4" height="5"/><rect x="240" y="750" width="4" height="5"/>
    <rect x="575" y="700" width="4" height="5"/><rect x="595" y="700" width="4" height="5"/>
    <rect x="835" y="750" width="4" height="5"/><rect x="855" y="750" width="4" height="5"/>
    <rect x="1320" y="710" width="4" height="5"/><rect x="1340" y="710" width="4" height="5"/>
  </g>

  <rect width="1600" height="900" fill="url(#leftFade)"/>
</svg>
